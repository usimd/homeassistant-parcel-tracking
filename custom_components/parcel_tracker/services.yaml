add:
  name: Add Parcel
  description: Register a new parcel for tracking
  fields:
    tracking_number:
      name: Tracking Number
      description: The carrier tracking number
      required: false
      selector:
        text:
    tracking_url:
      name: Tracking URL
      description: A tracking URL (carrier and tracking number will be auto-detected)
      required: false
      selector:
        text:
    carrier:
      name: Carrier
      description: Carrier name or Ship24 courier code. Optional when automatic detection succeeds.
      required: false
      selector:
        text:
    courier_code:
      name: Courier Code
      description: Optional Ship24 courier code, such as us-post. Takes precedence over the carrier name.
      required: false
      selector:
        text:
    shipping_date:
      name: Shipping Date
      description: Actual shipment date (YYYY-MM-DD). Leave empty if unknown.
      required: false
      selector:
        date:
    restrict_courier:
      name: Restrict to Courier
      description: Disable tracking through additional carriers, including last-mile handoffs.
      required: false
      default: false
      selector:
        boolean:
    description:
      name: Description
      description: Optional label for this parcel (e.g. "new keyboard")
      required: false
      selector:
        text:
    registered_by:
      name: Registered By
      description: Which device or user registered this parcel
      required: false
      selector:
        text:

remove:
  name: Remove Parcel
  description: Remove a parcel from tracking
  fields:
    tracking_number:
      name: Tracking Number
      description: The tracking number of the parcel to remove
      required: true
      selector:
        text:
